<!DOCTYPE html>
<html lang="en">

<head>
    <title>Student Subjects</title>
</head>

<body>

    <!-- Rowspan Example -->

    <table border="2">

        <thead>
            <tr>
                <th>Semester</th>
                <th>Subjects</th>
            </tr>
        </thead>

        <tbody>

            <tr>
                <td rowspan="4">Semester 1</td>
                <td>Programming in C</td>
            </tr>

            <tr>
                <td>Mathematics</td>
            </tr>

            <tr>
                <td>Computer Fundamentals</td>
            </tr>

            <tr>
                <td>Digital Electronics</td>
            </tr>

            <tr>
                <td rowspan="4">Semester 2</td>
                <td>Java Programming</td>
            </tr>

            <tr>
                <td>Data Structures</td>
            </tr>

            <tr>
                <td>Database Management</td>
            </tr>

            <tr>
                <td>Web Technology</td>
            </tr>

        </tbody>

    </table>


    <hr>
    <hr>


    <!-- Colspan Example -->

    <table border="2">

        <thead>

            <tr>
                <th colspan="4">Programming Languages</th>
                <th colspan="4">Technologies</th>
            </tr>

        </thead>

        <tbody>

            <tr>
                <td>C</td>
                <td>C++</td>
                <td>Java</td>
                <td>Python</td>

                <td>HTML</td>
                <td>CSS</td>
                <td>React</td>
                <td>Spring Boot</td>
            </tr>

        </tbody>

    </table>

</body>

</html>
