<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <fieldset>
        <legend>Contract Details</legend>
        <form>
            <h1>Input Types</h1>


            <lable>Enter Name:</lable>
            <input type = "text" placeholder = "Enter Name" / >

            <lable>Enter Email:</lable>
            <input type = "email" placeholder = "Enter Email"/>

            <lable>"Enter Phone Number:</lable>
            <input type = "number" placeholder ="Enter Phone Number"/>

            <lable>"Enter Password"</lable>
            <input type = "password" placeholder = "Enter Password"/>

            <lable>"Enter DOB"</lable>
            <input type = "date" placeholder = "Enter DOB"/>

            <br><br> 

            <lable>"Enter Month"</lable>
            <input type = "month" placeholder = "Enter Month"/>

            <lable>"Enter Week"</lable>
            <input type = "week" placeholder = "Enter Week"/>

            <lable>"Enter Date And Time"</lable>
            <input type = "datetime-local" placeholder = "Enter Date And Time"/>
            
            <hr>
            <hr>

            <lable>Choose Cities</lable>
            <input type = "checkbox" checked />Pune
            <input type = "checkbox" />Mumbai
            <input type = "checkbox" />Nagpur
            <input type = "checkbox" />Nashik

            <br><br>
            <lable> Select Gender</lable>
            <input type = "radio" name = "gender"/>Male
            <input type = "radio" name = "gender"/>Female
            <input type = "radio" name = "gender"/>Other

            <lable> Select Color</lable>
            <input type = "color" />

            <lable> Select Range</lable>
            <input type = "range" />

            <br><br>
            <label>Upload Docs</label>
            <input type = "file" />

            <br><br>
            <label>Upload Docs</label>
            <input type = "file" multiple/>  <!--For Muiltiple Files Upload -->

            <label>Search</label>
            <input type="search" placeholder = " type here to search"/>

            <label>Enter URL</label>   
            <input type = "url" placeholder = "Enter URL"/>
            
            <br>
            <label>Select City</label>
            <select>
                <option>Choose Your City</option>
                <option>Pune</option>
                <option>Mumbai</option>
                <option>Nagpur</option>
                <option>Nashik</option>
            </select>
            
            <label>Enter Address</label>
            <textarea rows = "4" cols = "15" placeholder = "Enter Address"></textarea>

            <br><br>
            <input type = "submit" value = "Submit Form"/>
            <input type = "button"  value = "Submit Form"/>
            <input type = "reset" value = "Reset Form"/>
        </form>
    </fieldset>
</body>
</html>
